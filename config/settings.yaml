# Настройки бота поддержки.
#
# Файл перечитывается на лету: правка применяется к следующему апдейту,
# перезапуск не нужен. Исключение — timezone (по нему собираются часы).
# Битый файл перезагрузку не ломает: бот остаётся на прежней конфигурации
# и один раз пишет ошибку в лог.

timezone: Europe/Moscow     # требует перезапуска

support:
  # Что видит клиент после сканирования QR. `key` уходит в базу и в callback_data
  # (латиница, цифры, подчёркивание, до 32 символов) — после запуска не менять:
  # старые тикеты ссылаются на него. `title` показывается людям, его править можно.
  categories:
    - {key: defect,  title: "Не работает / брак"}
    - {key: usage,   title: "Как пользоваться"}
    - {key: payment, title: "Оплата и возврат"}
    - {key: other,   title: "Другое"}

  # Bootstrap-доступ сотрудников. Основной реестр сотрудников хранится в БД.
  manager_user_ids: []

  # Кто управляет товарами, инструкциями и категориями через личку с ботом.
  admin_user_ids: []

  max_message_chars: 4000      # длиннее — просим сократить (лимит Telegram 4096)
  start_payload_max_chars: 64  # длина параметра ?start= из QR, остальное отбрасывается
